# CI and deploy for E-Universe. Runbook: server/scripts/CI-CD.md
#
#   every push and pull request   check: unit tests, route guards, lint (likely
#                                 bugs), fetch credentials, build, bundle budget
#   a version tag (v1.2.0) on     deploy-web: the VPS builds that tag with its
#   main, check passed            own .env and serves it at
#                                 https://embr3-onlinesystems.cloud/e-universe,
#                                 rolling back by itself if it does not answer
#
# Release: git tag v1.2.0 && git push origin v1.2.0
#
# The API is not deployed from here. It runs on the office server next to the
# NAS and SQL Server, which GitHub cannot and should not reach. That server
# takes the newest version tag itself (server/scripts/winserver/update.ps1)
# once the "check" job below has passed for it, so this job's name is part of
# that contract.
#
# This repository is public: pull requests from forks run "check", which needs
# no secrets, and nothing here runs on a machine of ours.

name: CI and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or tag at a time; a newer push does not cancel a deploy
# halfway.
concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  check:
    # update.ps1 on the office server looks for a check run with this name.
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            front-end/package-lock.json

      - name: Server dependencies
        working-directory: server
        run: npm ci

      - name: Unit tests (authorization, provinces, NAS paths; no database)
        working-directory: server
        run: npm run test:unit

      - name: Every non-public route checks the session
        working-directory: server
        # The router is only read, never started: the address is a placeholder
        # that nothing connects to, and no server/.env exists here.
        env:
          MONGO_URI: mongodb://127.0.0.1:1/ci-not-used
          SESSION_SECRET: ci-placeholder-not-a-real-secret-000000
        run: npm run audit:routes:unprotected

      - name: Front-end dependencies
        working-directory: front-end
        run: npm ci

      - name: Lint (likely bugs only)
        working-directory: front-end
        run: npm run lint:bugs

      - name: Every fetch sends the session cookie
        working-directory: front-end
        run: npm run check:fetch

      - name: Build
        working-directory: front-end
        # This build only proves the code compiles and fits the budget. The
        # one that goes live is made on the VPS with its own .env, so no real
        # key is needed or held here.
        env:
          VITE_API_BASE_URL: https://e-universe.embr3-onlinesystems.cloud
          VITE_CRYPTOJS_ENCRYPTION_KEY: ci-placeholder
        run: npm run build

      - name: Bundle budget
        working-directory: front-end
        run: npm run size

  deploy-web:
    name: deploy-web
    needs: check
    # Version tags only, and only once VPS_HOST is set (a repository variable):
    # until CI/CD is switched on, a tag gets its checks and nothing else.
    if: startsWith(github.ref, 'refs/tags/v') && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The SSH key lives on this environment, not the repository. Add required
    # reviewers there to make every release wait for an approval.
    environment:
      name: production
      url: https://embr3-onlinesystems.cloud/e-universe/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main. Release only from main."; exit 1; }

      - name: SSH key and pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS" || { echo "::error::VPS_SSH_KEY and VPS_KNOWN_HOSTS must be set on the production environment (server/scripts/vps/setup-e-universe-web.sh prints both)."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/eu_deploy
          chmod 600 ~/.ssh/eu_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Build and go live on the VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          # The key only runs eu-web-receive on the VPS; "build <tag>" is the
          # whole request. The VPS fetches the tag from GitHub itself.
          ssh -i ~/.ssh/eu_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o BatchMode=yes -o ServerAliveInterval=30 \
              "eu-deploy@$VPS_HOST" "build $GITHUB_REF_NAME"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/eu_deploy
