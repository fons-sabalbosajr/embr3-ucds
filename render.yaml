services:
  - type: web
    name: react-vite-frontend
    env: static
    rootDir: front-end
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: express-api-backend
    env: node
    rootDir: server
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard; never commit their values.
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
